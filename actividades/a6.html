<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="../index.html">Inicio</a>
    <script>
        let cantidada = 0;
        let cantidadb = "0";

        if (cantidada==cantidadb){
            alert("Con == cantidada es igual a cantidadb");
        }
        else{
            alert(" Con == cantidada es diferente a cantidadb");
        }
        if (cantidada===cantidadb){
            alert("Con === cantidada es igual a cantidadb");
        }
        else{
            alert("Con === cantidada es diferente a cantidadb");
        }
        if (cantidada!=cantidadb){
            alert("Con != cantidada es diferente a cantidadb");
        }
        else{
            alert("Con != cantidada es igual a cantidadb");
        }
        if (cantidada!==cantidadb){
            alert("Con !== cantidada es diferente a cantidadb");
        }
        else{
            alert("Con !== cantidada es igual a cantidadb");
        }
    </script>
</body>
</html>
