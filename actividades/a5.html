<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="../index.html">Inicio</a>
    <p>Explicación de cada línea en el código</p>
    <script>
        let cantidad = 0; // Se inicia con valor 0
        vacio = !cantidad; // Al ser 0 cantidad se guarda true al poner el contrario con !cantidad
        console.log("Cantidad: " + cantidad);
        console.log("Vacio: " + vacio);

        cantidad = 2; // Se cambia a 2
        vacio = !cantidad; // Al ser 2 cantidad se guarda false al poner el contrario con !cantidad
        console.log("Cantidad: " + cantidad);
        console.log("Vacio: " + vacio);

        let mensaje = ""; // Se pone a string vacio
        mensajeVacio = !mensaje; // Al ser string vacio mensaje se guarda true al poner el contrario con !mensaje
        console.log("Mensaje: " + mensaje);
        console.log("Mensaje vacío: " + mensajeVacio);

        mensaje = "Bienvenido"; // Se pone a string con texto
        mensajeVacio = !mensaje; // Al ser string con contenido se guarda false al poner el contrario con !mensaje
        console.log("Mensaje: " + mensaje);
        console.log("Mensaje vacío: " + mensajeVacio);

    </script>
</body>
</html>
