<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="../index.html">Inicio</a>
    <script>
        let numero = prompt("Ingrese un número:");
        let triangulo = "";
        for (let i = 1; i <= numero; i++) {
            for (let j = 1; j <= i; j++) {
                triangulo += "*";
            }
            triangulo += "\n";
        }
        alert(triangulo);
    </script>
</body>
</html>
